name: Update portfolio social preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_og_card.py"
      - ".github/workflows/update-og-card.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate-og-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate preview from current GitHub profile photo
        run: python scripts/generate_og_card.py

      - name: Commit preview only when it changed
        run: |
          if git diff --quiet -- assets/images/og-preview.png index.html && [ -f assets/images/og-preview.png ]; then
            echo "Social preview is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/og-preview.png index.html
          git commit -m "Update portfolio social preview"
          git push
